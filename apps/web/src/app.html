<!doctype html>
<html lang="en" class="%theme%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<meta name="theme-color" content="#111827" />
		<script>
			// A page kept from before a deploy (a restored tab) asks for build files that no longer exist, and the
			// app never starts. Reload it once to get the current build; the root layout marks a started app.
			addEventListener('unhandledrejection', (event) => {
				const message = String(event.reason?.message ?? '');
				const missing =
					/dynamically imported module: .*\/_app\/immutable\//.test(message) ||
					message.startsWith('Importing a module script failed');
				if (!missing || document.documentElement.hasAttribute('data-app-started')) return;
				const last = Number(sessionStorage.getItem('rc-reloaded-at'));
				if (Date.now() - last < 60_000) return;
				sessionStorage.setItem('rc-reloaded-at', String(Date.now()));
				location.reload();
			});
		</script>
		<script
			src="https://ry.zm.gl/api/script.js"
			async
			data-site-id="1"
			data-debounce="250"
			data-session-replay="true"
			data-track-errors="true"
			data-web-vitals="true"
		></script>
		<script
			defer
			src="https://static.cloudflareinsights.com/beacon.min.js"
			data-cf-beacon='{"token": "38e32c350f7e4fa2a25d89f51ec2055f"}'
		></script>
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="bg-gray-100 text-gray-900 dark:bg-gray-800 dark:text-gray-300"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
