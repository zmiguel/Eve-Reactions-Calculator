name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build -w apps/web
      - name: Dry-run deploy web
        run: npx wrangler deploy --dry-run
        working-directory: apps/web
      - name: Dry-run deploy updater
        run: npx wrangler deploy --dry-run
        working-directory: apps/updater

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # Seeds `.wrangler/e2e`, builds and serves on port 8790 (see scripts/e2e-server.ts).
      - run: npm run test:e2e
      - run: npm run lhci
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: e2e-reports
          path: |
            apps/web/test-results
            apps/web/.lighthouseci
